name: AutoTube AI - Video Render Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "The Job ID (or Video ID) to render"
        required: true
        type: string

# Keep this workflow manually dispatchable.
# The production backend should call workflow_dispatch with job_id.

permissions:
  contents: read

jobs:
  render_video:
    name: Render video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          for name in \
            DATABASE_URL \
            S3_ENDPOINT_URL \
            S3_BUCKET_NAME \
            S3_ACCESS_KEY_ID \
            S3_SECRET_ACCESS_KEY \
            R2_PUBLIC_DOMAIN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret $name is missing"
              exit 1
            fi
          done

          echo "Required production secrets are present."

      - name: Execute render job
        env:
          APP_ENV: production
          APP_MODE: cloud

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          STORAGE_BACKEND: r2
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          JOB_ID: ${{ inputs.job_id }}

        run: |
          set -euo pipefail

          if [ -z "${JOB_ID:-}" ]; then
            echo "::error::JOB_ID was not supplied"
            exit 1
          fi

          echo "Starting render for job: ${JOB_ID}"

          python -m backend.worker.main --job-id "$JOB_ID"

      - name: Find rendered MP4 files
        if: always()
        run: |
          echo "Searching workspace for MP4 files..."

          find . \
            -type f \
            \( -iname "*.mp4" -o -iname "*.m4v" \) \
            -not -path "./.git/*" \
            -print \
            | tee /tmp/mp4-files.txt

      - name: Validate rendered MP4 files
        if: success()
        run: |
          set -euo pipefail

          if [ ! -s /tmp/mp4-files.txt ]; then
            echo "::error::No MP4 file was produced by the render worker."
            exit 1
          fi

          while IFS= read -r file; do
            echo ""
            echo "========================================"
            echo "Validating: $file"
            echo "========================================"

            if [ ! -s "$file" ]; then
              echo "::error::MP4 file is empty: $file"
              exit 1
            fi

            ffprobe \
              -v error \
              -show_entries format=format_name,duration,size \
              -show_entries stream=index,codec_type,codec_name,pix_fmt,width,height \
              -of json \
              "$file"

            # Verify that ffprobe can actually decode/read the container.
            ffmpeg \
              -v error \
              -i "$file" \
              -map 0:v:0 \
              -f null \
              -

            echo "MP4 validation passed: $file"
          done < /tmp/mp4-files.txt

      - name: Render summary
        if: always()
        run: |
          echo "### Video Render" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Job ID:** \`${{ inputs.job_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/mp4-files.txt ]; then
            echo "**MP4 files found:**" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r file; do
              echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/mp4-files.txt
          else
            echo "**No MP4 files found in the runner workspace.**" >> "$GITHUB_STEP_SUMMARY"
          fi
