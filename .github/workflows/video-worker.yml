name: AutoTube AI - Video Render Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "The AutoTube Job ID to render"
        required: true
        type: string
  repository_dispatch:
    types: [render-video]

permissions:
  contents: read

concurrency:
  group: autotube-render-${{ inputs.job_id || github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  render_video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_ID: ${{ inputs.job_id || github.event.client_payload.job_id }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      AUTOTUBE_API_URL: ${{ secrets.AUTOTUBE_API_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install DB preflight dependency
        run: python -m pip install --disable-pip-version-check asyncpg

      - name: Database visibility preflight
        run: python scripts/verify_job_visibility.py

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg already available"
            ffmpeg -version | head -n 1
          else
            echo "FFmpeg not found. Installing..."
            sudo apt-get install -y ffmpeg
            ffmpeg -version | head -n 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Render Job
        env:
          APP_ENV: production
          APP_MODE: cloud
          WORKER_BACKEND: local

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          STORAGE_BACKEND: r2
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}

          JOB_ID: ${{ inputs.job_id }}

        run: |
          python -m backend.worker.main --job-id "$JOB_ID"
