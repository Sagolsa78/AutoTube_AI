services:
  - type: web
    name: autotube-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # ── App Mode ────────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: cloud
      - key: WORKER_BACKEND
        value: github_actions    # Cloud rendering via GitHub Actions (zero-cost)

      # ── Database (Neon PostgreSQL) ─────────────────────────────────────────
      - key: DATABASE_URL
        sync: false              # Set in Render dashboard: postgresql+asyncpg://...

      # ── Storage (Cloudflare R2) ────────────────────────────────────────────
      - key: STORAGE_BACKEND
        value: r2
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false              # https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false              # Optional: https://pub-<id>.r2.dev if bucket is public

      # ── GitHub Actions Worker ─────────────────────────────────────────────
      - key: GITHUB_TOKEN
        sync: false              # GitHub PAT with workflow:write scope
      - key: GITHUB_REPO
        value: Sagolsa78/AutoTube_AI
      - key: WORKER_GIT_REF
        value: main              # Pin to a specific commit SHA in production for reproducibility
      - key: WORKER_SECRET
        sync: false              # Shared secret for worker↔API authentication

      # ── Security ──────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false              # Long random string for JWT signing
      - key: ENCRYPTION_KEY
        sync: false              # Fernet key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"

      # ── AI Providers ──────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # ── Stock Footage ─────────────────────────────────────────────────────
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false

      # ── Frontend / CORS ───────────────────────────────────────────────────
      - key: FRONTEND_URL
        sync: false              # https://your-frontend.render.com (for OAuth redirects)
      - key: CORS_ORIGINS
        sync: false              # Comma-separated allowed origins

      # ── Beta Quotas ───────────────────────────────────────────────────────
      - key: MAX_ACTIVE_JOBS_PER_USER
        value: "2"
      - key: MAX_DAILY_JOBS_PER_USER
        value: "10"
