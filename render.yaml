services:
  - type: web
    name: autotube-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: cloud
      - key: WORKER_BACKEND
        value: github_actions
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: r2
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: Sagolsa78/AutoTube_AI
      - key: GITHUB_WORKFLOW_FILE
        value: video-worker.yml
      - key: WORKER_GIT_REF
        value: v2
      - key: WORKER_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_ACTIVE_JOBS_PER_USER
        value: "2"
      - key: MAX_DAILY_JOBS_PER_USER
        value: "10"
