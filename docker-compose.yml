services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: autotube
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autotube
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotube"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://autotube:password@db:5432/autotube
      - APP_ENV=${APP_ENV:-development}
      - APP_MODE=${APP_MODE:-local}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - WORKER_BACKEND=${WORKER_BACKEND:-local}
      - JWT_SECRET=${JWT_SECRET:-autotube-super-secret-jwt-signing-key-2026}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-autoshorts-assets}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      - DAILY_GPU_BUDGET_CAP=${DAILY_GPU_BUDGET_CAP:-2.00}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - AUTOTUBE_API_KEY=${AUTOTUBE_API_KEY:-}
    volumes:
      - .:/app
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: 
      context: .
      dockerfile: worker.Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://autotube:password@db:5432/autotube
      - APP_ENV=${APP_ENV:-development}
      - APP_MODE=${APP_MODE:-local}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - WORKER_BACKEND=${WORKER_BACKEND:-local}
      - JWT_SECRET=${JWT_SECRET:-autotube-super-secret-jwt-signing-key-2026}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-autoshorts-assets}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
    volumes:
      - .:/app
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:

